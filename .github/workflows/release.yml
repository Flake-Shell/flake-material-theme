name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Build release zip
        run: |
          mkdir -p flake-material-gtk
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='debian/' \
            --exclude='screenshots/' \
            source/ flake-material-gtk/
          zip -r flake-material-gtk.zip flake-material-gtk/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: flake-material-gtk.zip
          generate_release_notes: true
