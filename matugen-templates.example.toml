# Merge these template entries into ~/.config/matugen/config.toml.
# Adjust the theme directory if flake-material-gtk is installed elsewhere.

[templates.flake_material_gtk3]
input_path = '~/.themes/flake-material-gtk/gtk-3.0/colors-template.css'
output_path = '~/.themes/flake-material-gtk/gtk-3.0/colors.css'

[templates.flake_material_gtk4]
input_path = '~/.themes/flake-material-gtk/gtk-4.0/colors-template.css'
output_path = '~/.themes/flake-material-gtk/gtk-4.0/colors.css'
